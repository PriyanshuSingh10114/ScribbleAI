openapi: 3.0.0
info:
  title: ScribbleAI API
  description: API documentation for ScribbleAI backend.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local development server
paths:
  /user/register:
    post:
      summary: Register a new user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid input or email already in use
  
  /user/login:
    post:
      summary: Login a user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
          
  /user/credits:
    get:
      summary: Get user credits
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credits retrieved successfully
        '401':
          description: Unauthorized
          
  /ai/generate-image:
    post:
      summary: Generate an image using AI
      tags:
        - AI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
      responses:
        '200':
          description: Image Generated Successfully
        '401':
          description: Unauthorized
        '402':
          description: Insufficient credits

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
